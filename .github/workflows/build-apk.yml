name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Download game.zip from Google Drive
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install gdown
        python3 -c "import gdown; gdown.download('https://drive.google.com/uc?id=1jHhpBcUFrNkQfA3r4pB2Ijmx7DR094lY', 'game.zip', quiet=False)"

    - name: Install Cordova and Build APK
      run: |
        npm install -g cordova
        cordova create myApp com.crimecity.mafia "Crime City: Mafia Underworld"
        cd myApp
        cordova platform add android
        rm -rf www/*
        
        # Unzip game.zip into www folder
        unzip ../game.zip -d www/
        
        # Move inner files if zipped inside a subfolder
        if [ ! -f www/index.html ]; then
          mv www/*/* www/ 2>/dev/null || true
        fi
        
        # Enable Landscape & Fullscreen Mode in config.xml
        sed -i '/<\/widget>/i \    <preference name="Orientation" value="landscape" \/>' config.xml
        sed -i '/<\/widget>/i \    <preference name="Fullscreen" value="true" \/>' config.xml
        
        cordova build android --verbose

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Crime-City-Mafia-Underworld-APK
        path: myApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
